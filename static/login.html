<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI先知情报助手 - 登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); 
    min-height: 100vh; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; 
  }
  .card { 
    background: rgba(30, 41, 59, 0.9); 
    backdrop-filter: blur(20px); 
    border: 1px solid rgba(148, 163, 184, 0.15); 
    border-radius: 16px; padding: 36px; width: 400px; max-width: 92vw;
    box-shadow: 0 25px 50px rgba(0,0,0,0.5);
  }
  .logo { text-align: center; margin-bottom: 28px; }
  .logo .icon { font-size: 52px; margin-bottom: 8px; }
  .logo h1 { color: #f1f5f9; font-size: 24px; font-weight: 700; }
  .logo p { color: #94a3b8; font-size: 13px; margin-top: 6px; }
  .tabs { display: flex; border-bottom: 1px solid rgba(71, 85, 105, 0.4); margin-bottom: 24px; }
  .tab { 
    flex: 1; text-align: center; padding: 10px 0; font-size: 15px; font-weight: 500;
    color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s;
  }
  .tab.active { color: #38bdf8; border-bottom-color: #38bdf8; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; color: #94a3b8; font-size: 13px; margin-bottom: 6px; font-weight: 500; }
  .form-group input {
    width: 100%; padding: 11px 14px; border-radius: 8px; font-size: 14px;
    background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(148, 163, 184, 0.2); color: #e2e8f0;
    transition: all 0.2s; outline: none; font-family: inherit;
  }
  .form-group input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
  .btn {
    width: 100%; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600;
    border: none; cursor: pointer; color: #fff; transition: all 0.2s; font-family: inherit;
    background: linear-gradient(135deg, #0ea5e9, #6366f1);
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(56, 189, 248, 0.3); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .msg { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
  .msg.error { display: block; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; }
  .msg.success { display: block; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); color: #4ade80; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="icon">🔮</div>
    <h1>AI先知情报助手</h1>
    <p>智能资讯采集 · 审核 · 推送 · 论文精析</p>
  </div>

  <div class="tabs">
    <div class="tab active" data-mode="login" onclick="switchTab('login')">登录</div>
    <div class="tab" data-mode="register" onclick="switchTab('register')">注册</div>
  </div>

  <div id="msgBox" class="msg"></div>

  <form onsubmit="handleSubmit(event)">
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="username" required placeholder="请输入用户名" autocomplete="username">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" required placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button type="submit" class="btn" id="submitBtn">登 录</button>
  </form>
</div>

<script>
const API_BASE = '/api';
let currentMode = 'login';

// 登录后回跳地址（仅允许站内相对路径，防开放重定向）
function nextUrl() {
  const n = new URLSearchParams(location.search).get('next');
  return (n && n.startsWith('/') && !n.startsWith('//')) ? n : '/index.html';
}


// Tab切换
function switchTab(mode) {
  currentMode = mode;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-mode="${mode}"]`).classList.add('active');
  document.getElementById('submitBtn').textContent = mode === 'login' ? '登 录' : '注 册';
  hideMsg();
}

function showMsg(type, text) {
  const box = document.getElementById('msgBox');
  box.className = 'msg ' + type;
  box.textContent = text;
}
function hideMsg() { document.getElementById('msgBox').className = 'msg'; }

// SHA256 (Web Crypto API)
async function sha256(message) {
  const encoder = new TextEncoder();
  const data = encoder.encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// Fetch封装
async function apiRequest(url, options = {}) {
  const defaultHeaders = { 'Content-Type': 'application/json' };
  const resp = await fetch(API_BASE + url, {
    ...options,
    credentials: 'include',
    headers: { ...defaultHeaders, ...(options.headers || {}) }
  });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) {
    throw new Error(data.detail || '请求失败');
  }
  return data;
}

// 表单提交
async function handleSubmit(e) {
  e.preventDefault();
  hideMsg();

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('submitBtn');

  if (!username || !password) {
    showMsg('error', '请填写用户名和密码');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>处理中...';

  try {
    if (currentMode === 'login') {
      // 登录（明文传给后端，后端做哈希验证）
      const result = await apiRequest('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ username, password })
      });
      if (result.success) {
        const role = result.user.role;
        showMsg('success', `登录成功！欢迎回来，${result.user.username}（${getRoleName(role)}）`);
        setTimeout(() => { window.location.href = nextUrl(); }, 500);
      }
    } else {
      // 注册
      if (password.length < 6) {
        showMsg('error', '密码至少6位');
        btn.disabled = false;
        btn.textContent = '注 册';
        return;
      }
      const result = await apiRequest('/auth/register', {
        method: 'POST',
        body: JSON.stringify({ username, password })
      });
      if (result.success) {
        showMsg('success', '注册成功！请登录');
        setTimeout(() => switchTab('login'), 1000);
      }
    }
  } catch (e) {
    showMsg('error', e.message || '操作失败，请检查网络');
  }

  btn.disabled = false;
  btn.textContent = currentMode === 'login' ? '登 录' : '注 册';
}

function getRoleName(role) {
  const map = { individual: '普通用户', reviewer: '审核员', admin: '管理员', super_admin: '超级管理员' };
  return map[role] || role;
}

// 已登录自动跳转
(async function checkLogin() {
  try {
    const result = await apiRequest('/auth/me');
    if (result.success) {
      window.location.href = nextUrl();
    }
  } catch (e) { /* 未登录 */ }
})();
</script>
</body>
</html>
